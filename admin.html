<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioLens AR - Admin Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        /* บังคับ html และ body ให้เต็มจอ 100% ลบขอบขาวทิ้ง */
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            font-family: 'Kanit', sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            overflow: hidden; 
        }
        
        .input-box { background: #1e293b; border: 1px solid #334155; color: white; border-radius: 8px; padding: 10px; width: 100%; transition: border 0.2s; outline: none; }
        .input-box:focus { border-color: #3b82f6; }
        .label-text { font-size: 0.9rem; color: #94a3b8; font-weight: 500; margin-bottom: 4px; display: block; }
        
        /* สไตล์สำหรับ Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col m-0 p-0">

    <div id="loginPage" class="flex flex-col items-center justify-center h-full w-full p-6 bg-slate-900 absolute inset-0 z-50">
        <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md text-center border border-slate-700">
            <div class="text-5xl mb-4">🔐</div>
            <h1 class="text-3xl font-bold text-rose-500 mb-2">BioLens Admin</h1>
            <p class="text-slate-400 mb-8">เข้าสู่ระบบเพื่อจัดการเนื้อหาบทเรียน</p>
            
            <div class="space-y-4">
                <input type="email" id="email" class="input-box" placeholder="อีเมลแอดมิน">
                <input type="password" id="pass" class="input-box" placeholder="รหัสผ่าน">
                <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-500 transition-all p-4 rounded-xl text-white font-bold text-lg shadow-lg shadow-blue-900/20">เข้าสู่ระบบ</button>
            </div>
            <p id="errorMsg" class="text-red-400 mt-4 text-sm hidden">❌ อีเมลหรือรหัสผ่านไม่ถูกต้อง!</p>

            <div class="mt-8 pt-6 border-t border-slate-700">
                <button onclick="window.location.href='index.html'" class="text-slate-400 hover:text-white transition-colors text-sm flex items-center justify-center gap-2 w-full p-2">
                    <span>🔙</span> กลับไปหน้าแอปพลิเคชัน (Home)
                </button>
            </div>
        </div>
    </div>

    <header class="bg-slate-800 p-4 flex justify-between items-center border-b border-slate-700 shrink-0 shadow-sm z-10 relative">
        <div class="flex items-center gap-3">
            <span class="text-2xl">⚙️</span>
            <h1 class="text-xl font-bold text-white">Admin Dashboard</h1>
        </div>
        <div class="flex gap-3">
            <button onclick="syncInitialData()" class="bg-amber-600 hover:bg-amber-500 px-4 py-2 rounded-xl transition text-sm font-medium hidden" id="btnSync">📥 อัปโหลดข้อมูลเริ่มต้น</button>
            <button onclick="window.location.href='index.html'" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl transition text-sm flex items-center gap-2">🏠 กลับหน้าหลักแอป</button>
            <button onclick="logout()" class="bg-rose-600 hover:bg-rose-500 px-4 py-2 rounded-xl transition text-sm shadow-md">🚪 ออกจากระบบ</button>
        </div>
    </header>

    <div id="dashboard" class="hidden flex-row h-full overflow-hidden relative">
        
        <div class="w-72 bg-slate-800 border-r border-slate-700 p-4 overflow-y-auto shrink-0 flex flex-col">
            <h2 class="text-lg font-bold text-slate-300 mb-4 pb-2 border-b border-slate-700">📂 เลือกบทเรียน</h2>
            <div id="sidebarMenu" class="flex flex-col gap-4"></div>
        </div>

        <div class="flex-grow bg-slate-900 flex flex-col h-full overflow-hidden relative">
            
            <div id="welcomeScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-10 text-slate-500">
                <span class="text-6xl mb-4">👈</span>
                <p class="text-xl">กรุณาเลือกเนื้อหาจากเมนูด้านซ้าย</p>
            </div>

            <div id="editorHeader" class="bg-slate-800 p-6 border-b border-slate-700 flex justify-between items-center shrink-0">
                <div>
                    <h2 id="editingTitle" class="text-2xl font-bold text-blue-400">ชื่ออวัยวะ</h2>
                    <p class="text-slate-400 text-sm mt-1">แก้ไขเนื้อหาด้านล่าง เสร็จแล้วอย่าลืมกดบันทึก</p>
                </div>
                <button onclick="saveData()" class="bg-emerald-600 hover:bg-emerald-500 px-8 py-3 rounded-xl transition font-bold text-white shadow-lg shadow-emerald-900/40 flex items-center gap-2">
                    <span>💾</span> บันทึกการเปลี่ยนแปลง
                </button>
            </div>
            
            <div id="customEditorForm" class="flex-grow p-6 overflow-y-auto bg-slate-900">
                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 mb-6 shadow-sm">
                    <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2"><span>📝</span> ข้อมูลทั่วไป</h3>
                    
                    <div class="mb-4">
                        <label class="label-text">ชื่อบทเรียน / อวัยวะ (Name)</label>
                        <input type="text" id="frmName" class="input-box text-lg font-bold text-blue-300">
                    </div>
                    
                    <div class="mb-4">
                        <label class="label-text">ลิงก์ไฟล์โมเดล 3D (Model File Path)</label>
                        <input type="text" id="frmModelPath" class="input-box text-slate-400" placeholder="เช่น models/Heart.glb">
                    </div>
                    
                    <div>
                        <label class="label-text">คำอธิบายภาพรวม (Description) - รองรับโค้ด HTML เช่น &lt;br&gt;, &lt;b&gt;</label>
                        <textarea id="frmDesc" class="input-box h-32"></textarea>
                    </div>
                </div>

                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 mb-6 shadow-sm">
                    <h3 class="text-lg font-bold text-white mb-4 flex justify-between items-center">
                        <span class="flex items-center gap-2"><span>🎯</span> ข้อมูลจุดคลิกบนโมเดล (Click Parts)</span>
                    </h3>
                    <div id="clickPartsContainer" class="space-y-4">
                        </div>
                </div>

                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-sm mb-10">
                    <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2"><span>📝</span> แบบทดสอบ (Quiz)</h3>
                    <div id="quizContainer" class="space-y-6">
                        </div>
                </div>
            </div>

        </div>
    </div>

<script>
// --- 1. ตั้งค่า Firebase ---
const firebaseConfig = {
  apiKey: "AIzaSyB9TZN4-yUb9Kfh0gdZNp6XglsbS-xEzfk",
  authDomain: "biolens-ar.firebaseapp.com",
  projectId: "biolens-ar",
  storageBucket: "biolens-ar.firebasestorage.app",
  messagingSenderId: "1088692183155",
  appId: "1:1088692183155:web:d139f94812eca627e08a06"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let globalDatabase = null;
let currentSysIndex = null;
let currentItemIndex = null;
let currentItemData = null; 

// --- 2. ระบบจัดการ Login ---
auth.onAuthStateChanged(user => {
    if (user) {
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('dashboard').classList.add('flex');
        loadDataFromCloud(); 
    } else {
        document.getElementById('loginPage').classList.remove('hidden');
        document.getElementById('dashboard').classList.add('hidden');
    }
});

function login() {
    const e = document.getElementById('email').value;
    const p = document.getElementById('pass').value;
    auth.signInWithEmailAndPassword(e, p).catch(err => {
        document.getElementById('errorMsg').classList.remove('hidden');
    });
}

function logout() {
    if(confirm("ยืนยันการออกจากระบบ?")) auth.signOut();
}

// --- 3. โหลดและสร้างเมนู ---
function loadDataFromCloud() {
    db.collection("database").doc("anatomy").get().then(doc => {
        if(doc.exists) {
            globalDatabase = doc.data();
            renderSidebar();
            document.getElementById('btnSync').classList.add('hidden');
        } else {
            alert("⚠️ ยังไม่มีข้อมูลบน Cloud! โปรดกดอัปโหลดข้อมูลเริ่มต้นครับ");
            document.getElementById('btnSync').classList.remove('hidden');
        }
    });
}

function syncInitialData() {
    if(confirm("ดึงข้อมูลจากไฟล์ anatomy_data.json ขึ้น Firebase ยืนยันหรือไม่?")) {
        fetch("anatomy_data.json").then(r => r.json()).then(data => {
            db.collection("database").doc("anatomy").set(data).then(() => {
                alert("✅ อัปโหลดสำเร็จ!");
                loadDataFromCloud();
            });
        });
    }
}

function renderSidebar() {
    const menuContainer = document.getElementById('sidebarMenu');
    menuContainer.innerHTML = '';

    globalDatabase.systems.forEach((sys, sysIdx) => {
        let section = `<div class="mb-5">
            <h3 class="text-blue-400 font-bold mb-2 text-xs uppercase tracking-widest pl-2">${sys.category}</h3>
            <div class="flex flex-col gap-1">`;
        
        sys.items.forEach((item, itemIdx) => {
            section += `
                <button onclick="editItem(${sysIdx}, ${itemIdx})" id="btn-${sysIdx}-${itemIdx}" class="text-left bg-slate-900/50 hover:bg-slate-700 px-4 py-3 rounded-xl text-sm transition text-slate-300 menu-btn border border-slate-700/50 hover:border-slate-600">
                    📄 ${item.name}
                </button>`;
        });
        
        section += `</div></div>`;
        menuContainer.innerHTML += section;
    });
}

// --- 4. การจัดการฟอร์มแก้ไข ---
function editItem(sysIdx, itemIdx) {
    currentSysIndex = sysIdx;
    currentItemIndex = itemIdx;
    
    currentItemData = JSON.parse(JSON.stringify(globalDatabase.systems[sysIdx].items[itemIdx]));

    document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-500'));
    document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.add('bg-slate-900/50', 'text-slate-300'));
    const activeBtn = document.getElementById(`btn-${sysIdx}-${itemIdx}`);
    activeBtn.classList.remove('bg-slate-900/50', 'text-slate-300');
    activeBtn.classList.add('bg-blue-600', 'text-white', 'border-blue-500');

    document.getElementById('welcomeScreen').classList.add('hidden');
    
    document.getElementById('editingTitle').textContent = `แก้ไข: ${currentItemData.name}`;
    document.getElementById('frmName').value = currentItemData.name || '';
    document.getElementById('frmModelPath').value = currentItemData.model_file || '';
    document.getElementById('frmDesc').value = currentItemData.description || '';

    renderClickPartsForm();
    renderQuizForm();
}

function renderClickPartsForm() {
    const container = document.getElementById('clickPartsContainer');
    container.innerHTML = '';
    
    let partsData = currentItemData.click_parts;
    if (!partsData && currentItemData.alt_mode && currentItemData.alt_mode.click_parts) {
        partsData = currentItemData.alt_mode.click_parts;
    }

    if (!partsData || partsData.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-sm italic">ไม่มีข้อมูลจุดคลิกสำหรับโมเดลนี้</p>`;
        return;
    }

    partsData.forEach((part, index) => {
        container.innerHTML += `
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                <div class="flex gap-4">
                    <div class="w-1/3">
                        <label class="label-text text-xs">ชื่อวัสดุในไฟล์ 3D (ห้ามแก้ถ้าไม่จำเป็น)</label>
                        <input type="text" class="input-box text-sm text-slate-400 bg-slate-800" value="${part.material_name}" readonly>
                    </div>
                    <div class="w-2/3">
                        <label class="label-text text-xs text-blue-300">ชื่อที่จะแสดงให้เด็กเห็น (แก้ไขได้)</label>
                        <input type="text" class="input-box text-sm font-bold text-white border-blue-900" value="${part.name}" onchange="updatePartName(${index}, this.value)">
                    </div>
                </div>
                <div class="mt-3">
                    <label class="label-text text-xs text-blue-300">คำอธิบายรายละเอียด (แก้ไขได้)</label>
                    <textarea class="input-box text-sm h-20 border-blue-900" onchange="updatePartInfo(${index}, this.value)">${part.info || ''}</textarea>
                </div>
            </div>
        `;
    });
}

function updatePartName(index, val) {
    if (currentItemData.click_parts) currentItemData.click_parts[index].name = val;
    else if (currentItemData.alt_mode) currentItemData.alt_mode.click_parts[index].name = val;
}
function updatePartInfo(index, val) {
    if (currentItemData.click_parts) currentItemData.click_parts[index].info = val;
    else if (currentItemData.alt_mode) currentItemData.alt_mode.click_parts[index].info = val;
}

function renderQuizForm() {
    const container = document.getElementById('quizContainer');
    container.innerHTML = '';

    if (!currentItemData.quiz || currentItemData.quiz.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-sm italic">ไม่มีข้อสอบสำหรับหมวดนี้</p>`;
        return;
    }

    currentItemData.quiz.forEach((q, qIndex) => {
        let choicesHTML = '';
        q.choices.forEach((choice, cIndex) => {
            const isAnswer = (q.answer === cIndex);
            choicesHTML += `
                <div class="flex items-center gap-3 mb-2 bg-slate-800 p-2 rounded-lg border ${isAnswer ? 'border-emerald-500 bg-emerald-900/20' : 'border-slate-700'}">
                    <input type="radio" name="ans-${qIndex}" ${isAnswer ? 'checked' : ''} onchange="updateQuizAnswer(${qIndex}, ${cIndex})" class="w-4 h-4 text-emerald-500 focus:ring-emerald-500 bg-slate-700 border-slate-600">
                    <input type="text" class="input-box text-sm flex-grow bg-transparent border-none p-1 focus:bg-slate-900" value="${choice}" onchange="updateQuizChoice(${qIndex}, ${cIndex}, this.value)">
                    ${isAnswer ? '<span class="text-emerald-500 text-xs font-bold px-2">✓ เฉลย</span>' : ''}
                </div>
            `;
        });

        container.innerHTML += `
            <div class="bg-slate-900 p-5 rounded-xl border border-slate-700 shadow-inner relative">
                <span class="absolute -top-3 -left-3 bg-blue-600 text-white w-8 h-8 flex items-center justify-center rounded-full font-bold shadow-lg">Q${qIndex + 1}</span>
                <div class="mb-4 ml-4">
                    <label class="label-text text-blue-300">โจทย์คำถาม</label>
                    <textarea class="input-box text-base font-medium h-16 border-blue-900" onchange="updateQuizQuestion(${qIndex}, this.value)">${q.question}</textarea>
                </div>
                <div class="ml-4">
                    <label class="label-text mb-2">ตัวเลือก (คลิกจุดกลมๆ เพื่อเลือกข้อที่ถูกต้องเป็นเฉลย)</label>
                    ${choicesHTML}
                </div>
            </div>
        `;
    });
}

function updateQuizQuestion(qIdx, val) { currentItemData.quiz[qIdx].question = val; }
function updateQuizChoice(qIdx, cIdx, val) { currentItemData.quiz[qIdx].choices[cIdx] = val; }
function updateQuizAnswer(qIdx, newAnsIdx) { 
    currentItemData.quiz[qIdx].answer = newAnsIdx; 
    renderQuizForm(); 
}

// --- 5. กดปุ่มบันทึก ---
function saveData() {
    if (!currentItemData) return;

    currentItemData.name = document.getElementById('frmName').value;
    currentItemData.model_file = document.getElementById('frmModelPath').value;
    currentItemData.description = document.getElementById('frmDesc').value;

    globalDatabase.systems[currentSysIndex].items[currentItemIndex] = currentItemData;

    document.getElementById('editorHeader').classList.add('opacity-50', 'pointer-events-none');
    
    db.collection("database").doc("anatomy").set(globalDatabase).then(() => {
        alert("🎉 บันทึกการแก้ไขสำเร็จ! นักเรียนจะเห็นข้อมูลใหม่ทันที");
        renderSidebar(); 
        document.getElementById('editorHeader').classList.remove('opacity-50', 'pointer-events-none');
    }).catch(e => {
        alert("❌ เกิดข้อผิดพลาดในการบันทึก: " + e.message);
        document.getElementById('editorHeader').classList.remove('opacity-50', 'pointer-events-none');
    });
}
</script>
</body>
</html>
