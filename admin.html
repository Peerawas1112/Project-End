<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioLens AR - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        html, body { height: 100%; margin: 0; font-family: 'Kanit', sans-serif; background: #0f172a; color: #f8fafc; overflow: hidden; }
        .input-box { background: #1e293b; border: 1px solid #334155; color: white; border-radius: 12px; padding: 12px; width: 100%; outline: none; transition: 0.2s; }
        .input-box:focus { border-color: #3b82f6; }
        .rich-editor-content { padding: 15px; min-height: 100px; background: #1e293b; color: white; outline: none; line-height: 1.6; }
        .rich-editor-content b { color: #fbbf24; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .sidebar-item.active { background: #2563eb; color: white; border-color: #3b82f6; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <div id="loginPage" class="flex flex-col items-center justify-center h-full w-full p-6 bg-slate-950 absolute inset-0 z-50">
        <div class="bg-slate-900 p-10 rounded-[2rem] shadow-2xl w-full max-w-md text-center border border-slate-800">
            <div class="text-5xl mb-4">⚙️</div>
            <h1 class="text-3xl font-bold text-white mb-2">BioLens Admin</h1>
            <p class="text-slate-400 mb-8">เข้าสู่ระบบจัดการเนื้อหาและโครงสร้าง</p>
            <input type="email" id="email" class="input-box mb-4" placeholder="อีเมล">
            <input type="password" id="pass" class="input-box mb-6" placeholder="รหัสผ่าน">
            <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-500 p-4 rounded-xl text-white font-bold transition">เข้าสู่ระบบ</button>
            <p id="errorMsg" class="text-red-400 mt-4 text-sm hidden">❌ เข้าสู่ระบบไม่สำเร็จ</p>
            <button onclick="window.location.href='index.html'" class="mt-6 text-slate-500 hover:text-white text-sm transition">🔙 กลับหน้าแอป</button>
        </div>
    </div>

    <header class="bg-slate-800 p-4 flex justify-between items-center border-b border-slate-700 shrink-0 z-10 shadow-sm">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-white">Admin Dashboard</h1>
        </div>
        <div class="flex gap-3">
            <button onclick="syncInitialData()" class="bg-amber-600 hover:bg-amber-500 px-4 py-2 rounded-xl text-sm hidden" id="btnSync">📥 โหลดข้อมูลเริ่มต้น</button>
            <button onclick="addNewSystem()" class="bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white px-4 py-2 rounded-xl text-sm transition border border-blue-600/30">➕ เพิ่มระบบร่างกาย</button>
            <button onclick="addNewItem()" class="bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-white px-4 py-2 rounded-xl text-sm transition border border-emerald-600/30">➕ เพิ่มอวัยวะใหม่</button>
            <button onclick="clearAllData()" class="bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white px-4 py-2 rounded-xl text-sm transition border border-rose-600/30">🧹 ล้าง Cloud</button>
            <div class="w-[1px] bg-slate-700 mx-2"></div>
            <button onclick="window.location.href='index.html'" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-sm">🏠 กลับหน้าหลัก</button>
            <button onclick="logout()" class="bg-slate-900 hover:bg-rose-700 px-4 py-2 rounded-xl text-sm border border-slate-700">🚪 ออก</button>
        </div>
    </header>

    <div id="dashboard" class="hidden flex-row h-full overflow-hidden">
        <div class="w-80 bg-slate-800 border-r border-slate-700 p-5 overflow-y-auto shrink-0">
            <div id="sidebarMenu" class="space-y-6"></div>
        </div>

        <div class="flex-grow bg-slate-900 flex flex-col h-full overflow-hidden relative">
            <div id="welcomeScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-10 text-slate-500">
                <span class="text-6xl mb-4">👈</span>
                <p class="text-lg">เลือกบทเรียนจากเมนูด้านซ้ายเพื่อเริ่มจัดการ</p>
            </div>

            <div id="editorHeader" class="bg-slate-800 p-6 border-b border-slate-700 flex justify-between items-center shrink-0">
                <h2 id="editingTitle" class="text-2xl font-bold text-blue-400">Editor</h2>
                <div class="flex gap-3">
                    <button onclick="deleteCurrentItem()" class="text-rose-400 hover:bg-rose-400/10 px-4 py-2 rounded-lg text-sm border border-rose-400/20">🗑️ ลบหน้านี้</button>
                    <button onclick="saveData()" class="bg-emerald-600 hover:bg-emerald-500 px-10 py-3 rounded-2xl font-bold text-white shadow-lg flex items-center gap-2">💾 บันทึกข้อมูล</button>
                </div>
            </div>
            
            <div class="flex-grow p-8 overflow-y-auto space-y-8">
                <div class="bg-slate-800 p-8 rounded-[2rem] border border-slate-700 shadow-sm">
                    <div class="grid grid-cols-2 gap-6 mb-6">
                        <div>
                            <label class="text-xs text-slate-400 mb-2 block uppercase tracking-wider">ชื่อหัวข้อ (Name)</label>
                            <input type="text" id="frmName" class="input-box text-lg font-bold text-white">
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 mb-2 block uppercase tracking-wider">ลิงก์โมเดล (Model Path)</label>
                            <input type="text" id="frmModelPath" class="input-box font-mono text-emerald-400 text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 mb-2 block uppercase tracking-wider">คำอธิบาย (Description)</label>
                        <div class="border border-slate-700 rounded-xl overflow-hidden focus-within:border-blue-500 transition">
                            <div class="bg-slate-900 p-2 border-b border-slate-700 flex gap-2">
                                <button type="button" onmousedown="event.preventDefault(); document.execCommand('bold', false, null);" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-1 rounded transition"><b>B</b> ทำตัวหนา</button>
                                <span class="text-[10px] text-slate-500 self-center ml-2">*ลากเมาส์คลุมข้อความที่ต้องการแล้วกดปุ่มนี้</span>
                            </div>
                            <div id="frmDesc" class="rich-editor-content border-none" contenteditable="true"></div>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-800 p-8 rounded-[2rem] border border-slate-700 shadow-sm">
                    <h3 class="text-amber-400 font-bold mb-6 flex items-center gap-2">🎯 จุดคลิกบนโมเดล (Click Parts)</h3>
                    <div id="clickPartsContainer" class="space-y-4"></div>
                    <button onclick="addClickPart()" class="mt-4 text-sm text-amber-500 hover:text-amber-400 font-medium">+ เพิ่มจุดคลิก</button>
                </div>

                <div class="bg-slate-800 p-8 rounded-[2rem] border border-slate-700 shadow-sm mb-20">
                    <h3 class="text-rose-400 font-bold mb-6 flex items-center gap-2">📝 แบบทดสอบ (Quiz)</h3>
                    <div id="quizContainer" class="space-y-6"></div>
                    <button onclick="addQuiz()" class="mt-4 text-sm text-rose-500 hover:text-rose-400 font-medium">+ เพิ่มข้อสอบ</button>
                </div>
            </div>
        </div>
    </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB9TZN4-yUb9Kfh0gdZNp6XglsbS-xEzfk",
  authDomain: "biolens-ar.firebaseapp.com",
  projectId: "biolens-ar",
  storageBucket: "biolens-ar.firebasestorage.app",
  messagingSenderId: "1088692183155",
  appId: "1:1088692183155:web:d139f94812eca627e08a06"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let globalDatabase = null, currentSysIndex = null, currentItemIndex = null, currentItemData = null;

auth.onAuthStateChanged(user => {
    if (user) {
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('dashboard').classList.add('flex');
        loadData();
    } else {
        document.getElementById('loginPage').classList.remove('hidden');
        document.getElementById('dashboard').classList.add('hidden');
    }
});

function login() {
    const e = document.getElementById('email').value, p = document.getElementById('pass').value;
    auth.signInWithEmailAndPassword(e, p).catch(() => document.getElementById('errorMsg').classList.remove('hidden'));
}
function logout() { auth.signOut(); }

function loadData() {
    db.collection("database").doc("anatomy").get().then(doc => {
        if(doc.exists) { 
            globalDatabase = doc.data(); 
            renderSidebar(); 
            document.getElementById('btnSync').classList.add('hidden');
        } else {
            document.getElementById('btnSync').classList.remove('hidden');
        }
    }).catch(err => {
        console.error(err);
        alert("เชื่อมต่อฐานข้อมูลไม่สำเร็จ กรุณาเช็กอินเทอร์เน็ตหรือ API Key Restriction");
    });
}

function syncInitialData() {
    if(confirm("ดึงข้อมูลเริ่มต้นจาก anatomy_data.json ขึ้น Cloud ใช่หรือไม่?")) {
        fetch("anatomy_data.json").then(r => r.json()).then(data => {
            db.collection("database").doc("anatomy").set(data).then(() => { alert("โหลดข้อมูลสำเร็จ!"); loadData(); });
        });
    }
}

function renderSidebar() {
    const menu = document.getElementById('sidebarMenu'); menu.innerHTML = '';
    if (!globalDatabase || !globalDatabase.systems) return; // ป้องกัน Error ถ้าไม่มีข้อมูล
    
    globalDatabase.systems.forEach((sys, sIdx) => {
        let html = `<div class="mb-4"><div class="flex justify-between items-center px-2 mb-2">
                <h3 class="text-blue-500 font-bold text-[11px] uppercase tracking-wider">${sys.category}</h3>
                <button onclick="deleteSystem(${sIdx})" class="text-[9px] text-slate-500 hover:text-rose-500 transition">ลบกลุ่ม</button>
            </div><div class="flex flex-col gap-1">`;
        sys.items.forEach((item, iIdx) => {
            const isActive = (currentSysIndex === sIdx && currentItemIndex === iIdx);
            html += `<button onclick="editItem(${sIdx}, ${iIdx})" class="sidebar-item text-left p-3 rounded-xl text-sm transition border border-transparent ${isActive ? 'active' : 'bg-slate-900/30 text-slate-400 hover:bg-slate-700/50'}">📄 ${item.name}</button>`;
        });
        html += `</div></div>`;
        menu.innerHTML += html;
    });
}

function editItem(sIdx, iIdx) {
    currentSysIndex = sIdx; currentItemIndex = iIdx;
    currentItemData = JSON.parse(JSON.stringify(globalDatabase.systems[sIdx].items[iIdx]));
    
    // ป้องกัน Error หากข้อมูลในระบบไม่มี Array ของ click_parts และ quiz
    if (!currentItemData.click_parts) currentItemData.click_parts = [];
    if (!currentItemData.quiz) currentItemData.quiz = [];

    document.getElementById('welcomeScreen').classList.add('hidden');
    document.getElementById('editingTitle').textContent = currentItemData.name;
    document.getElementById('frmName').value = currentItemData.name;
    document.getElementById('frmModelPath').value = currentItemData.model_file;
    document.getElementById('frmDesc').innerHTML = currentItemData.description || '';
    renderSidebar(); renderParts(); renderQuiz();
}

function addClickPart() { currentItemData.click_parts.push({material_name:'', name:'', info:''}); renderParts(); }
function addQuiz() { currentItemData.quiz.push({question:'คำถามใหม่', choices:['','','',''], answer:0}); renderQuiz(); }

function renderParts() {
    const container = document.getElementById('clickPartsContainer'); container.innerHTML = '';
    const parts = currentItemData.click_parts || [];
    parts.forEach((p, idx) => {
        container.innerHTML += `<div class="grid grid-cols-12 gap-3 bg-slate-900/50 p-4 rounded-xl border border-slate-700">
            <input type="text" class="col-span-3 input-box text-xs font-mono" value="${p.material_name}" oninput="currentItemData.click_parts[${idx}].material_name=this.value" placeholder="ID ในโมเดล">
            <div class="col-span-8 space-y-2">
                <input type="text" class="input-box text-xs" value="${p.name}" oninput="currentItemData.click_parts[${idx}].name=this.value" placeholder="ชื่อเรียก (รองรับ HTML)">
                <input type="text" class="input-box text-xs" value="${p.info}" oninput="currentItemData.click_parts[${idx}].info=this.value" placeholder="รายละเอียด (รองรับ HTML)">
            </div>
            <button onclick="currentItemData.click_parts.splice(${idx},1);renderParts()" class="col-span-1 text-rose-500 hover:text-rose-400 transition">✕</button>
        </div>`;
    });
}

function renderQuiz() {
    const container = document.getElementById('quizContainer'); container.innerHTML = '';
    const quiz = currentItemData.quiz || [];
    quiz.forEach((q, idx) => {
        container.innerHTML += `<div class="bg-slate-900/50 p-6 rounded-2xl border border-slate-700">
            <input type="text" class="input-box mb-4 font-medium" value="${q.question}" oninput="currentItemData.quiz[${idx}].question=this.value" placeholder="โจทย์คำถาม">
            <div class="grid grid-cols-2 gap-3">
                ${q.choices.map((c, cIdx) => `<div class="flex gap-2 items-center"><input type="radio" name="ans-${idx}" ${q.answer===cIdx?'checked':''} onchange="currentItemData.quiz[${idx}].answer=${cIdx}">
                <input type="text" class="input-box text-xs ${q.answer===cIdx?'border-emerald-500':''}" value="${c}" oninput="currentItemData.quiz[${idx}].choices[${cIdx}]=this.value"></div>`).join('')}
            </div>
            <button onclick="currentItemData.quiz.splice(${idx},1);renderQuiz()" class="mt-4 text-[10px] text-rose-500 opacity-50 hover:opacity-100 transition">ลบข้อสอบนี้</button>
        </div>`;
    });
}

function saveData() {
    if(currentSysIndex === null) return;
    currentItemData.name = document.getElementById('frmName').value;
    currentItemData.model_file = document.getElementById('frmModelPath').value;
    currentItemData.description = document.getElementById('frmDesc').innerHTML;
    globalDatabase.systems[currentSysIndex].items[currentItemIndex] = currentItemData;
    db.collection("database").doc("anatomy").set(globalDatabase).then(() => { alert("บันทึกข้อมูลเรียบร้อยแล้ว! ✅"); renderSidebar(); });
}

// ==========================================
// 🛡️ ฟังก์ชันที่มีการยืนยันตัวตนก่อนลบ
// ==========================================

function deleteCurrentItem() {
    if(confirm(`⚠️ ยืนยันการลบอวัยวะ [${currentItemData.name}] ออกจากระบบถาวร?`)) {
        globalDatabase.systems[currentSysIndex].items.splice(currentItemIndex, 1);
        db.collection("database").doc("anatomy").set(globalDatabase).then(() => { 
            currentItemData = null; currentSysIndex = null; currentItemIndex = null;
            renderSidebar(); 
            document.getElementById('welcomeScreen').classList.remove('hidden'); 
        });
    }
}

function deleteSystem(idx) { 
    const sysName = globalDatabase.systems[idx].category;
    const conf = prompt(`⚠️ พิมพ์ชื่อ "${sysName}" ด้านล่างเพื่อยืนยันการลบหมวดหมู่นี้ทิ้ง:`);
    if(conf === sysName) { 
        globalDatabase.systems.splice(idx, 1); 
        db.collection("database").doc("anatomy").set(globalDatabase).then(() => renderSidebar()); 
    } else if (conf !== null) {
        alert("พิมพ์ชื่อไม่ถูกต้อง ยกเลิกการลบ");
    }
}

function clearAllData() { 
    // แก้ไขการขึ้นบรรทัดใหม่จาก \\n เป็น \n
    const conf = prompt("🔥 คำเตือนขั้นสูงสุด: หากต้องการลบข้อมูลบทเรียนทั้งหมดใน Cloud\nโปรดพิมพ์คำว่า 'CONFIRM DELETE'");
    if(conf === "CONFIRM DELETE") {
        db.collection("database").doc("anatomy").delete().then(() => location.reload()); 
    } else if (conf !== null) {
        alert("รหัสยืนยันไม่ถูกต้อง ยกเลิกการล้างข้อมูล");
    }
}

function addNewSystem() { 
    const n = prompt("ชื่อระบบใหม่:"); 
    if(n) { 
        if(!globalDatabase) globalDatabase = { systems: [] }; // ป้องกันบั๊กกรณีฐานข้อมูลว่างเปล่า
        globalDatabase.systems.push({category: n, items: []}); 
        db.collection("database").doc("anatomy").set(globalDatabase).then(() => renderSidebar()); 
    } 
}

function addNewItem() { 
    if(currentSysIndex === null) return alert("โปรดเลือกกลุ่มก่อนเพิ่มอวัยวะ"); 
    globalDatabase.systems[currentSysIndex].items.push({name: "อวัยวะใหม่", model_file: "models/brain.glb", description: "", click_parts: [], quiz: []}); 
    db.collection("database").doc("anatomy").set(globalDatabase).then(() => renderSidebar()); 
}

// 🌟 ป้องกันการก๊อปปี้สไตล์แปลกๆ จากเว็บอื่นมาวางในช่อง Editor
document.addEventListener('paste', function(e) {
    if (e.target.isContentEditable) {
        e.preventDefault();
        let text = (e.originalEvent || e).clipboardData.getData('text/plain');
        document.execCommand('insertText', false, text);
    }
});
</script>
</body>
</html>
