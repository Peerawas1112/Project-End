<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>BioLens AR</title>

<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* =========================================
   1. Base & Reset
   ========================================= */
:root { --primary: #ff4757; --bg: #020617; --glass: rgba(15, 23, 42, 0.85); --border: rgba(255, 255, 255, 0.15); }
body{ margin:0; padding:0; font-family:Kanit,sans-serif; background:var(--bg); color:white; height:100vh; width: 100vw; overflow:hidden; }
* { box-sizing: border-box; }

#load-shell { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: #1e293b; z-index: 2000; display: none; }
#load-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }

/* =========================================
   2. Home & Quiz Pages
   ========================================= */
.home, .quiz-page { position:fixed; inset:0; display:flex; justify-content:center; align-items:center; background:var(--bg); z-index:1000; padding: 20px; }
.quiz-page { display:none; }
.box { width:100%; max-width:480px; max-height: 90vh; overflow-y: auto; background:var(--glass); border-radius:28px; padding:35px; text-align:center; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
.box::-webkit-scrollbar { display: none; }

button { padding:14px 20px; border:none; border-radius:16px; background:var(--primary); color:white; font-size:1rem; cursor:pointer; transition: 0.2s; font-family: Kanit; font-weight: 500; }
button:active { transform: scale(0.95); }
button:disabled { background: #475569; opacity: 0.5; cursor: not-allowed; }

.choice { background:#1e293b; padding:16px; border-radius:16px; margin:12px 0; cursor:pointer; text-align: left; border: 1px solid transparent; transition: 0.2s; }
.choice:hover { background: #334155; }
.choice.selected { background: #3b82f6 !important; border-color: #93c5fd; }
.choice.disabled { pointer-events: none; }

.grade-text { font-size: 4rem; font-weight: bold; color: var(--primary); margin: 10px 0; }

/* =========================================
   3. Main Workspace
   ========================================= */
.main { position:fixed; top:0; left:0; width:100vw; height:100vh; display: none; z-index: 1; }
model-viewer { width:100%; height:calc(100vh - 60px); margin-top: 60px; --poster-color: transparent; outline: none; cursor: crosshair; }

.app-header { position: absolute; top:0; left:0; width:100%; height: 60px; display: none; align-items: center; justify-content: space-between; padding: 0 20px; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); z-index: 500; }

.tabs, .menu { position: absolute; display: none; gap: 10px; z-index: 100; pointer-events: none; }
.tab-btn, .menu-item { pointer-events: auto; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border); border-radius: 16px; color: white; cursor: pointer; text-align: center; transition: 0.3s; padding: 10px 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
.tab-btn.active, .menu-item.active { background: var(--primary); border-color: var(--primary); }

.info-panel { 
    position: absolute; 
    top: 50%; 
    left: 30px; 
    transform: translateY(-50%); 
    width: 380px; 
    background: var(--glass); 
    border-radius: 24px; 
    border: 1px solid var(--border); 
    pointer-events: auto; 
    z-index: 10; 
    padding: 24px; 
    backdrop-filter: blur(10px); 
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
}

.tabs { top: 80px; left: 50%; transform: translateX(-50%); flex-direction: row; }
.menu { right: 30px; top: 50%; transform: translateY(-50%); flex-direction: column; }

.toggle-mode-btn { position: absolute; top: 80px; right: 20px; background: rgba(15, 23, 42, 0.9); color: white; border: 1px solid var(--primary); border-radius: 12px; padding: 10px 16px; z-index: 200; cursor: pointer; display: none; transition: 0.3s; }
.toggle-mode-btn:hover { background: var(--primary); }

/* =========================================
   4. Modals & Floating Cards (QR & Info)
   ========================================= */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 20px; opacity: 0; animation: fadeIn 0.3s forwards; }
@keyframes fadeIn { to { opacity: 1; } }
.modal-box { background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 25px; width: 100%; max-width: 400px; text-align: center; color: white; transform: scale(0.95); animation: popUp 0.3s forwards ease-out; }
@keyframes popUp { to { transform: scale(1); } }

.part-info-card {
    position: absolute;
    top: 50%;
    right: 170px;
    transform: translateY(-50%);
    width: 360px;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 25px;
    color: white;
    z-index: 20;
    backdrop-filter: blur(10px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    display: none;
    flex-direction: column;
    animation: slideInRight 0.3s forwards ease-out;
}
@keyframes slideInRight {
    from { opacity: 0; transform: translate(30px, -50%); }
    to { opacity: 1; transform: translate(0, -50%); }
}

.modal-title { 
    color: #ffffff;
    background: transparent;
    font-size: 1.3rem; 
    margin: 0 0 15px 0; 
    padding: 0 0 12px 0;
    border: none;
    border-bottom: 2px solid var(--primary);
    border-radius: 0; 
    line-height: 1.4;
    text-align: center;
    box-shadow: none;
    letter-spacing: 0.5px;
}

.modal-desc { 
    font-size: 0.95rem; 
    color: #cbd5e1; 
    line-height: 1.5; 
    margin-bottom: 20px; 
    text-align: left; 
    max-height: 250px;  
    overflow-y: auto;   
    padding-right: 5px; 
}
.modal-desc::-webkit-scrollbar { width: 6px; }
.modal-desc::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
.modal-desc::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
.modal-desc::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

.close-modal-btn { 
    background: var(--primary); 
    color: white; 
    border: none; 
    padding: 10px 32px; 
    border-radius: 12px; 
    cursor: pointer; 
    font-family: 'Kanit'; 
    font-size: 1rem;
    width: max-content; 
    display: block;
    margin: 5px auto 0 auto; 
    align-self: center; 
    box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3); 
    transition: 0.2s;
}
.close-modal-btn:hover { background: #ff6b81; transform: translateY(-2px); }

/* 🌟 ปุ่มกากบาท (X) สำหรับปิดกล่องข้อมูลหลัก */
.close-info-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: transparent;
    color: #94a3b8; 
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
    box-shadow: none; 
}
.close-info-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: white;
}

/* =========================================
   5. ซ่อน UI (Focus Mode)
   ========================================= */
.info-panel, .menu, .tabs, .toggle-mode-btn, .app-header, .app-header span, .part-info-card { 
    transition: all 0.3s ease-in-out; 
}

.ui-hidden .info-panel, .ui-hidden .menu, .ui-hidden .tabs, .ui-hidden .toggle-mode-btn { 
    opacity: 0; pointer-events: none; visibility: hidden; 
}

.ui-hidden .app-header { background: transparent; backdrop-filter: none; border-bottom: transparent; }
.ui-hidden .app-header span { opacity: 0; }

/* =========================================
   📱 6. โหมดมือถือ (Mobile Responsive)
   ========================================= */
@media (max-width: 768px) {
    .app-header { padding: 0 10px; }
    .app-header span { display: none; } 
    .app-header button { padding: 6px 10px; font-size: 0.75rem; }

    .tabs {
        top: 70px; width: 95%; overflow-x: auto; justify-content: flex-start; padding-bottom: 5px;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn { white-space: nowrap; font-size: 0.85rem; padding: 8px 15px; flex-shrink: 0; }

    .menu {
        top: auto; bottom: 20px; right: 50%; transform: translateX(50%);
        flex-direction: row; width: 95%; overflow-x: auto;
    }
    .menu::-webkit-scrollbar { display: none; }
    .menu-item { white-space: nowrap; font-size: 0.85rem; padding: 8px 15px; flex-shrink: 0; }

    .info-panel {
        top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 90%; padding: 15px; max-height: 40vh; overflow-y: auto; background: rgba(15, 23, 42, 0.95);
    }
    
    .part-info-card {
        top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 90%; max-height: 50vh; overflow-y: auto;
    }
    @keyframes slideInRight {
        from { opacity: 0; transform: translate(-50%, -40%); }
        to { opacity: 1; transform: translate(-50%, -50%); }
    }

    .toggle-mode-btn { top: 120px; right: 10px; font-size: 0.8rem; padding: 8px 12px; }
}
</style>
</head>

<body>

<div id="infoModal" class="part-info-card">
  <h3 id="modalTitle" class="modal-title">ชื่อส่วนประกอบ</h3>
  <div id="modalDesc" class="modal-desc">รายละเอียด...</div>
  <button class="close-modal-btn" onclick="closeInfoAndReset()">ปิดหน้าต่าง</button>
</div>

<div id="qrModal" class="modal-overlay">
    <div class="modal-box">
      <h3 class="modal-title" style="background:transparent; border:none; padding:0; box-shadow:none;">📱 สแกนเพื่อดูแบบ AR</h3>
      <div id="qrcode" style="display:flex; justify-content:center; margin: 20px 0; background: white; padding: 15px; border-radius: 10px;"></div>
      <p style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 15px;">ใช้กล้องมือถือสแกนเพื่อโชว์โมเดล 3 มิติแบบทะลุจอบนโต๊ะเรียน</p>
      <button class="close-modal-btn" onclick="closeModals()" style="background: #475569; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">ปิดหน้าต่าง</button>
    </div>
</div>

<div id="load-shell"><div id="load-bar"></div></div>

<div id="home" class="home">
  <div class="box">
    <h1 style="margin-bottom: 0px; color: var(--primary); font-size: 2.2rem;">BioLens AR</h1>
    <h2 style="font-size: 1.1rem; color: #cbd5e1; margin-top: 5px; margin-bottom: 15px; font-weight: 400;">ท่องโลกกายวิภาคศาสตร์ | วิทยาศาสตร์ ม.2</h2>
    
    <p id="loadingText" style="color: #fbbf24; margin-bottom: 25px;">กำลังโหลดข้อมูลบทเรียน...</p>
    
    <button id="btnLearn" onclick="startLearning()" style="width: 100%;" disabled>📚 เข้าบทเรียนเนื้อหา 3D</button>
    <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button id="btnPre" onclick="openQuiz('ก่อนเรียน')" style="flex: 1;" disabled>📝 ทดสอบก่อนเรียน</button>
        <button id="btnPost" onclick="openQuiz('หลังเรียน')" style="flex: 1;" disabled>📝 ทดสอบหลังเรียน</button>
    </div>
  </div>
</div>

<div id="quizPage" class="quiz-page">
  <div class="box" id="quizBox">
    <div id="quizHeader">
        <div id="quizType" style="color:var(--primary); font-weight:500; font-size: 1.2rem; margin-bottom: 10px;"></div>
    </div>
    <div id="quizBody">
        <h2 id="qTitle" style="font-size: 1.1rem; min-height: 60px; line-height: 1.4;"></h2>
        <div id="qChoices"></div>
        <button id="nextQuestionBtn" onclick="nextQuestion()" style="display:none; width: 100%; margin-top: 15px; background: #3b82f6;">ข้อต่อไป ➡️</button>
        <p id="qProgress" style="font-size: 0.8rem; color: #94a3b8; margin-top: 15px;"></p>
    </div>
    <button id="exitQuizBtn" onclick="closeQuiz()" style="background:none; border:1px solid #4b5563; color:#94a3b8; margin-top:15px; width: 100%;">ยกเลิก / กลับหน้าหลัก</button>
  </div>
</div>

<div class="app-header" id="appHeader">
    <span style="font-size: 1.1rem; color: #ffffff; font-weight: 500; letter-spacing: 1px;">BioLens AR</span>
    <div style="display: flex; gap: 10px;">
        <button onclick="toggleInfoBox()" style="background:none; border:1px solid var(--border); font-size: 0.85rem; padding: 6px 14px; color: #4ade80; transition: 0.3s;">
            ℹ️ ข้อมูล
        </button>
        <button onclick="resetCamera()" style="background:none; border:1px solid var(--border); font-size: 0.85rem; padding: 6px 14px; color: #60a5fa; transition: 0.3s;">
            🎯 จัดกึ่งกลาง
        </button>
        <button id="toggleUIBtn" onclick="toggleUI()" style="background:none; border:1px solid var(--border); font-size: 0.85rem; padding: 6px 14px; color: white; transition: 0.3s;">
            👁️ ซ่อน UI
        </button>
        <button id="fullscreenBtn" onclick="toggleFullScreen()" style="background:none; border:1px solid var(--border); font-size: 0.85rem; padding: 6px 14px; color: white;">
            🔲 ขยายเต็มจอ
        </button>
        <button onclick="backToHome()" style="background:none; border:1px solid var(--border); font-size: 0.85rem; padding: 6px 14px; color: white;">
            🏠 กลับหน้าหลัก
        </button>
    </div>
</div>

<main class="main" id="mainArea">
  <nav class="tabs" id="tabs"></nav>
  <model-viewer id="viewer" autoplay camera-controls auto-rotate disable-tap shadow-intensity="1" exposure="1.2" environment-image="neutral"></model-viewer>
  <button id="toggleModeBtn" class="toggle-mode-btn" onclick="toggleModelMode()">👁️ ดูแบบเจาะลึก</button>
  
  <div class="info-panel" id="mainInfoPanel">
    <button class="close-info-btn" onclick="toggleInfoBox()">✖</button>
    <h3 id="title" style="margin-right: 30px;"></h3> 
    <p id="desc"></p>
    <button onclick="showQRCode()" style="width: 100%; background: #3b82f6; padding: 10px; font-size: 0.9rem; margin-top: 5px;">📱 สแกน QR ดู AR บนมือถือ</button>
  </div>
  
  <footer class="menu" id="menu"></footer>
</main>

<script>
let data = [], currentQuizData = [], qIndex = 0, score = 0;
let currentCorrectText = ""; 
let selectedAnswerText = ""; 
let userAnswers = []; 
let currentOrganData = null; 
let isAltMode = false;       
let currentActiveModelUrl = ""; 
let lastHighlightedMaterial = null; 

function resetHighlight() {
    if (lastHighlightedMaterial) {
        lastHighlightedMaterial.setEmissiveFactor([0, 0, 0]); 
        lastHighlightedMaterial = null;
    }
}

function resetCamera() {
    if (viewer) {
        viewer.cameraTarget = "auto auto auto"; 
        viewer.cameraOrbit = "0deg 75deg auto"; 
    }
}

const home = document.getElementById("home");
const quizPage = document.getElementById("quizPage");
const viewer = document.getElementById("viewer");
const tabs = document.getElementById("tabs");
const menu = document.getElementById("menu");
const loadBar = document.getElementById("load-bar");
const loadShell = document.getElementById("load-shell");
const infoModal = document.getElementById("infoModal");
const qrModal = document.getElementById("qrModal");
const toggleBtn = document.getElementById("toggleModeBtn");

document.querySelectorAll('.modal-overlay').forEach(modal => {
    modal.addEventListener('click', function(e) {
        if (e.target === this) closeModals();
    });
});

function closeModals() {
    infoModal.style.display = 'none';
    qrModal.style.display = 'none';
    resetHighlight(); 
    
    if (viewer) {
        viewer.autoRotate = true;
    }
}

function closeInfoAndReset() {
    closeModals();
    resetCamera();
}

// 🌟 ฟังก์ชันสำหรับ เปิด/ปิด กล่องข้อความ
function toggleInfoBox() {
    const panel = document.getElementById("mainInfoPanel");
    if (panel.style.display === "none") {
        panel.style.display = "block";
    } else {
        panel.style.display = "none";
    }
}

viewer.addEventListener('progress', (e) => {
    loadShell.style.display = "block";
    loadBar.style.width = (e.detail.totalProgress * 100) + "%";
    if(e.detail.totalProgress === 1) {
        setTimeout(() => { loadShell.style.display = "none"; }, 400);
    }
});

fetch("anatomy_data.json?v=" + new Date().getTime())
.then(r => {
    if(!r.ok) throw new Error("ไม่สามารถโหลดไฟล์ข้อมูลได้");
    return r.json();
})
.then(j => {
    data = j.systems;
    renderTabs();
    if (data.length > 0) loadSystem(0);
    
    document.getElementById("loadingText").textContent = "ระบบพร้อมใช้งานแล้ว";
    document.getElementById("loadingText").style.color = "#4ade80"; 
    document.getElementById("btnLearn").disabled = false;
    document.getElementById("btnPre").disabled = false;
    document.getElementById("btnPost").disabled = false;
})
.catch(err => {
    console.error("Error:", err);
    document.getElementById("loadingText").textContent = "ไม่พบไฟล์ฐานข้อมูล (JSON)";
    document.getElementById("loadingText").style.color = "#ef4444";
});

function renderTabs() {
    tabs.innerHTML = data.map((s, i) => `<div class="tab-btn" id="t${i}" onclick="loadSystem(${i})">${s.category}</div>`).join("");
}

function loadSystem(i) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    const activeTab = document.getElementById("t" + i);
    if(activeTab) activeTab.classList.add("active");
    
    if (data[i].items && data[i].items.length > 0) {
        menu.innerHTML = data[i].items.map((o, j) => `<div class="menu-item" id="m${i}${j}" onclick="selectOrgan(${i},${j})">${o.name}</div>`).join("");
        selectOrgan(i, 0);
    } else {
        menu.innerHTML = "";
    }
}

function selectOrgan(i, j) {
    document.querySelectorAll(".menu-item").forEach(m => m.classList.remove("active"));
    const activeMenu = document.getElementById(`m${i}${j}`);
    if(activeMenu) activeMenu.classList.add("active");

    const o = data[i].items[j];
    currentOrganData = o;
    isAltMode = false;

    if (o.alt_mode) {
        toggleBtn.style.display = "block";
        toggleBtn.innerHTML = "👁️ ดูแบบเจาะลึกภายใน";
    } else {
        toggleBtn.style.display = "none";
    }

    loadModelData(currentOrganData);
}

function loadModelData(dataObj) {
    resetHighlight(); 
    resetCamera();
    
    // 🌟 สั่งให้โชว์กล่องข้อมูลทุกครั้งที่มีการเปลี่ยนอวัยวะ
    document.getElementById("mainInfoPanel").style.display = "block"; 
    
    loadShell.style.display = "block";
    loadBar.style.width = "10%";
    viewer.src = ""; 

    document.getElementById("title").textContent = dataObj.name;
    document.getElementById("desc").innerHTML = dataObj.description; 
    currentActiveModelUrl = dataObj.model_file; 

    setTimeout(() => { viewer.src = dataObj.model_file; }, 50); 
}

function toggleModelMode() {
    if (!currentOrganData || !currentOrganData.alt_mode) return;

    toggleBtn.style.pointerEvents = "none";
    toggleBtn.style.opacity = "0.5";

    if (isAltMode) {
        isAltMode = false;
        toggleBtn.innerHTML = "👁️ ดูแบบเจาะลึกภายใน";
        loadModelData(currentOrganData);
    } else {
        isAltMode = true;
        toggleBtn.innerHTML = "🫀 กลับสู่โหมดมองภายนอก";
        loadModelData(currentOrganData.alt_mode);
    }

    const unlockButton = () => {
        toggleBtn.style.pointerEvents = "auto";
        toggleBtn.style.opacity = "1";
        viewer.removeEventListener('load', unlockButton); 
    };
    viewer.addEventListener('load', unlockButton);
}

viewer.addEventListener('click', (event) => {
    const material = viewer.materialFromPoint(event.clientX, event.clientY);
    if (material != null) {
        const partsData = isAltMode ? currentOrganData.alt_mode.click_parts : currentOrganData.click_parts;
        if (partsData) {
            const clickedPart = partsData.find(p => p.material_name === material.name);
            if (clickedPart) {
                resetHighlight();
                material.setEmissiveFactor([0.4, 0.4, 0.4]); 
                lastHighlightedMaterial = material; 
                document.getElementById('modalTitle').innerHTML = clickedPart.name;
                document.getElementById('modalDesc').innerHTML = clickedPart.info || "ไม่มีข้อมูลรายละเอียดเพิ่มเติม"; 
                infoModal.style.display = 'flex';
                
                viewer.cameraTarget = "auto auto auto"; 
                viewer.autoRotate = false;
            }
        }
    } else {
        closeModals();
    }
});

function showQRCode() {
    qrModal.style.display = 'flex';
    const qrcodeContainer = document.getElementById("qrcode");
    qrcodeContainer.innerHTML = ""; 
    const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
    const arUrl = `${baseUrl}/ar-viewer.html?model=${encodeURIComponent(currentActiveModelUrl)}`;
    new QRCode(qrcodeContainer, {
        text: arUrl, width: 150, height: 150, colorDark : "#0f172a", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
    });
}

function startLearning() {
    home.style.display = "none";
    document.getElementById("appHeader").style.display = "flex";
    document.getElementById("mainArea").style.display = "block";
    tabs.style.display = "flex";
    menu.style.display = "flex"; 
}
function backToHome() {
    document.getElementById("appHeader").style.display = "none";
    document.getElementById("mainArea").style.display = "none";
    tabs.style.display = "none";
    menu.style.display = "none";
    home.style.display = "flex";
}
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

// =========================================================
// ระบบ Quiz
// =========================================================
function openQuiz(type) {
    let allQuestions = [];
    data.forEach(system => {
        if(system.items) system.items.forEach(item => { if (item.quiz) allQuestions = allQuestions.concat(item.quiz); });
    });
    if (allQuestions.length === 0) return alert("ยังไม่มีคำถามในระบบครับ");
    currentQuizData = shuffleArray([...allQuestions]).slice(0, 5);
    
    qIndex = 0; score = 0; userAnswers = []; 
    
    document.getElementById("quizType").textContent = "แบบทดสอบ" + type;
    home.style.display = "none";
    quizPage.style.display = "flex";
    document.getElementById("exitQuizBtn").style.display = "block";
    
    showQuestion();
}

function showQuestion() {
    selectedAnswerText = ""; 
    document.getElementById("nextQuestionBtn").style.display = "none"; 
    
    if (qIndex >= currentQuizData.length) return showResult();
    
    const q = currentQuizData[qIndex];
    currentCorrectText = q.choices[q.answer];
    const shuffledChoices = shuffleArray([...q.choices]);
    
    document.getElementById("qTitle").textContent = q.question;
    document.getElementById("qChoices").innerHTML = shuffledChoices.map(c => `<div class="choice" onclick="selectChoice(this)">${c}</div>`).join("");
    document.getElementById("qProgress").textContent = `ข้อที่ ${qIndex + 1} / ${currentQuizData.length}`;
}

function selectChoice(element) {
    document.querySelectorAll(".choice").forEach(c => c.classList.remove("selected"));
    element.classList.add("selected");
    selectedAnswerText = element.textContent;
    document.getElementById("nextQuestionBtn").style.display = "block";
}

function nextQuestion() {
    if (!selectedAnswerText) return; 
    
    const q = currentQuizData[qIndex];
    const isCorrect = (selectedAnswerText === currentCorrectText);
    
    if (isCorrect) score++;
    
    userAnswers.push({
        question: q.question,
        selected: selectedAnswerText,
        correct: currentCorrectText,
        isCorrect: isCorrect
    });
    
    qIndex++; 
    showQuestion();
}

function showResult() {
    const percent = (score / currentQuizData.length) * 100;
    const grade = percent >= 80 ? "A" : percent >= 70 ? "B" : percent >= 60 ? "C" : percent >= 50 ? "D" : "F";
    
    let summaryHTML = `<div class="modal-desc" style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 16px; margin-bottom: 20px;">`;
    summaryHTML += `<h3 style="color:var(--primary); margin: 0 0 15px 0;">📋 สรุปเฉลยคำตอบ</h3>`;
    
    userAnswers.forEach((ans, idx) => {
        const borderColor = ans.isCorrect ? '#4ade80' : '#f87171';
        summaryHTML += `
            <div style="background: #1e293b; padding: 12px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid ${borderColor};">
                <div style="margin-bottom: 5px; color: #e2e8f0; font-size: 0.9rem;"><b>ข้อ ${idx+1} :</b> ${ans.question}</div>
                <div style="color: ${borderColor}; font-size: 0.85rem;"><b>นักเรียนตอบ :</b> ${ans.selected} ${ans.isCorrect ? '✅' : '❌'}</div>
                ${!ans.isCorrect ? `<div style="color: #4ade80; margin-top: 5px; font-size: 0.85rem;"><b>คำตอบที่ถูกต้อง :</b> ${ans.correct}</div>` : ''}
            </div>
        `;
    });
    summaryHTML += `</div>`;

    document.getElementById("qTitle").textContent = "🎉 สรุปผลการทดสอบ";
    document.getElementById("qChoices").innerHTML = `
        <div style="font-size: 1rem; color: #cbd5e1; margin-top:10px;">เกรดที่ได้</div>
        <div class="grade-text" style="font-size: 3rem;">${grade}</div>
        <div style="font-size: 1.2rem; margin-bottom: 10px;">คะแนน: ${score} / ${currentQuizData.length}</div>
        <p style="color: ${percent >= 50 ? '#4ade80' : '#f87171'}; font-size: 1rem; margin-bottom: 20px;">
            ${percent >= 50 ? 'เยี่ยมมาก! ผ่านเกณฑ์แล้วครับ ✨' : 'สู้ๆ นะครับ ลองทบทวนเนื้อหาใหม่อีกครั้ง 📚'}
        </p>
        ${summaryHTML}
        <button onclick="closeQuiz()" style="width:100%; padding: 16px;">กลับหน้าหลัก</button>
    `;
    
    document.getElementById("qProgress").textContent = "";
    document.getElementById("nextQuestionBtn").style.display = "none";
    document.getElementById("exitQuizBtn").style.display = "none";
}

function closeQuiz() { 
    quizPage.style.display = "none"; 
    home.style.display = "flex"; 
}

// ---------------------------------------------------------
// ระบบขยายเต็มจอ (Full Screen Mode)
// ---------------------------------------------------------
function toggleFullScreen() {
    const doc = document.documentElement;
    const btn = document.getElementById("fullscreenBtn");
    if (!document.fullscreenElement) {
        if (doc.requestFullscreen) doc.requestFullscreen();
        else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
        else if (doc.msRequestFullscreen) doc.msRequestFullscreen();
        btn.innerHTML = "🗗 ย่อหน้าจอ";
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
        btn.innerHTML = "🔲 ขยายเต็มจอ";
    }
}

// ---------------------------------------------------------
// ระบบ ซ่อน/แสดง UI (Focus Mode)
// ---------------------------------------------------------
function toggleUI() {
    const body = document.body;
    const btn = document.getElementById("toggleUIBtn");
    body.classList.toggle("ui-hidden");
    if (body.classList.contains("ui-hidden")) {
        btn.innerHTML = "👁️‍🗨️ แสดง UI";
        btn.style.borderColor = "var(--primary)";
        btn.style.color = "var(--primary)";
    } else {
        btn.innerHTML = "👁️ ซ่อน UI";
        btn.style.borderColor = "var(--border)";
        btn.style.color = "white";
    }
}
</script>
